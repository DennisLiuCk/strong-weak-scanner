name: qualitative-quality

on:
  push:
    paths:
      - "notes/qualitative/**"
      - "notes/leading_hypotheses/**"
      - "notes/research_topics/**"
      - "notes/research_candidates/**"
      - "notes/research_method_reviews/**"
      - "notes/knowledge_graph/**"
      - "notes/events/**"
      - "config/groups.csv"
      - "config/knowledge_concepts.csv"
      - "config/external_entities.csv"
      - "LEADING_HYPOTHESES.md"
      - "LEADING_HYPOTHESES_PHASE1_REVIEW.md"
      - "LEADING_HYPOTHESES_PHASE2_RUNBOOK.md"
      - "RESEARCH_MAINTENANCE.md"
      - "MARKET_RESEARCH_METHOD.md"
      - "config/universe.csv"
      - "scripts/qual_notes.py"
      - "scripts/qual_evidence.py"
      - "scripts/leading_hypotheses.py"
      - "scripts/research_queue.py"
      - "scripts/research_radar.py"
      - "scripts/research_method_audit.py"
      - "scripts/knowledge_graph.py"
      - "scripts/build_dashboard.py"
      - "scripts/dashboard_template.html"
      - "scripts/research_template.html"
      - "tests/test_qual_notes_quality.py"
      - "tests/test_qual_evidence.py"
      - "tests/test_leading_hypotheses.py"
      - "tests/test_research_queue.py"
      - "tests/test_research_radar.py"
      - "tests/test_research_method_audit.py"
      - "tests/test_recent_research_articles.py"
      - "tests/test_dashboard_ux_contract.py"
      - "tests/test_research_center.py"
      - "tests/test_knowledge_graph.py"
      - "tests/test_entry_docs_sync.py"
      - "CLAUDE.md"
      - "AGENTS.md"
      - ".github/workflows/qualitative-quality.yml"
      - ".github/workflows/research-watch.yml"
  pull_request:
    paths:
      - "notes/qualitative/**"
      - "notes/leading_hypotheses/**"
      - "notes/research_topics/**"
      - "notes/research_candidates/**"
      - "notes/research_method_reviews/**"
      - "notes/knowledge_graph/**"
      - "notes/events/**"
      - "config/groups.csv"
      - "config/knowledge_concepts.csv"
      - "config/external_entities.csv"
      - "LEADING_HYPOTHESES.md"
      - "LEADING_HYPOTHESES_PHASE1_REVIEW.md"
      - "LEADING_HYPOTHESES_PHASE2_RUNBOOK.md"
      - "RESEARCH_MAINTENANCE.md"
      - "MARKET_RESEARCH_METHOD.md"
      - "config/universe.csv"
      - "scripts/qual_notes.py"
      - "scripts/qual_evidence.py"
      - "scripts/leading_hypotheses.py"
      - "scripts/research_queue.py"
      - "scripts/research_radar.py"
      - "scripts/research_method_audit.py"
      - "scripts/knowledge_graph.py"
      - "scripts/build_dashboard.py"
      - "scripts/dashboard_template.html"
      - "scripts/research_template.html"
      - "tests/test_qual_notes_quality.py"
      - "tests/test_qual_evidence.py"
      - "tests/test_leading_hypotheses.py"
      - "tests/test_research_queue.py"
      - "tests/test_research_radar.py"
      - "tests/test_research_method_audit.py"
      - "tests/test_recent_research_articles.py"
      - "tests/test_dashboard_ux_contract.py"
      - "tests/test_research_center.py"
      - "tests/test_knowledge_graph.py"
      - "tests/test_entry_docs_sync.py"
      - "CLAUDE.md"
      - "AGENTS.md"
      - ".github/workflows/qualitative-quality.yml"
      - ".github/workflows/research-watch.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: 稽核質化研究品質契約
        run: python scripts/qual_notes.py --lint

      - name: 稽核領先假說格式與正式筆記錨定
        run: python scripts/leading_hypotheses.py --lint

      - name: 稽核研究議題與掃描紀錄
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          baseline="HEAD^"
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            baseline="$PR_BASE"
          elif [[ "$EVENT_NAME" == "push" && ! "$PUSH_BEFORE" =~ ^0+$ ]]; then
            baseline="$PUSH_BEFORE"
          fi
          python scripts/research_queue.py --lint --baseline-ref "$baseline"

      - name: 稽核研究中心知識圖譜與證據引用
        run: python scripts/knowledge_graph.py --lint

      - name: 稽核候選雷達與研究方法歷史
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          baseline="HEAD^"
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            baseline="$PR_BASE"
          elif [[ "$EVENT_NAME" == "push" && ! "$PUSH_BEFORE" =~ ^0+$ ]]; then
            baseline="$PUSH_BEFORE"
          fi
          python scripts/research_radar.py --lint
          python scripts/research_method_audit.py --lint --baseline-ref "$baseline"

      - name: 執行質化品質、dashboard 與入口文件契約測試
        run: python -m unittest tests.test_qual_notes_quality tests.test_qual_evidence tests.test_leading_hypotheses tests.test_research_queue tests.test_research_radar tests.test_research_method_audit tests.test_recent_research_articles tests.test_dashboard_ux_contract tests.test_research_center tests.test_knowledge_graph tests.test_entry_docs_sync
