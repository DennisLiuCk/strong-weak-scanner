  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: 共用研究發布前檢查（基準、歷史、測試與隔離重建）
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          baseline="HEAD^"
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            baseline="$PR_BASE"
          elif [[ "$EVENT_NAME" == "push" && ! "$PUSH_BEFORE" =~ ^0+$ ]]; then
            baseline="$PUSH_BEFORE"
          fi
          python scripts/prepublish_check.py --baseline-ref "$baseline" --output-dir tmp/prepublish-ci

      - name: 檢查失敗時列出原始紀錄
        if: failure()
        run: |
          if [ -d tmp/prepublish-ci ]; then
            find tmp/prepublish-ci -maxdepth 1 -name '*.log' -print -exec tail -n 60 {} \;
          fi
