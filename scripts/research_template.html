<style>

  --line:rgba(255,255,255,.14);--line2:rgba(255,255,255,.06);--strong:#ff746e;

*{box-sizing:border-box}

.result-bottom{display:flex;align-items:flex-end;gap:8px}.status{font-size:9.5px;font-weight:800;line-height:1.35}.status.verified{color:var(--teal)}.status.observational{color:var(--purple)}.status.warning,.status.draft{color:var(--amber)}

.article-section strong{color:var(--ink)}
.table-wrap{width:100%;overflow-x:auto;margin:4px 0 18px;border:1px solid var(--line);border-radius:8px}.table-wrap:focus-visible{outline:3px solid color-mix(in srgb,var(--teal) 32%,transparent);outline-offset:2px}

.outline{padding-top:93px;min-width:0}.outline-sticky{position:sticky;top:76px;padding-left:18px;border-left:1px solid var(--line)}
.outline h2{margin:0 0 13px;font-size:12px;font-weight:900}.toc{display:flex;flex-direction:column;gap:0;margin-bottom:26px}.toc button{border:0;border-left:2px solid var(--line);background:none;color:var(--muted);text-align:left;padding:6px 0 6px 12px;font-size:10px;line-height:1.45;cursor:pointer}.toc button:hover{color:var(--teal);border-left-color:var(--teal)}.toc button.beginner-toc{border-left-color:var(--teal);color:var(--teal);font-weight:800}

.source-link{display:inline-block;margin-top:14px;font-size:10.5px;font-weight:800}.reader-placeholder{height:100%;display:grid;place-items:center;color:var(--muted);padding:30px;text-align:center}
.footer-note{font-size:10px;line-height:1.6;color:var(--muted);padding-top:28px}
.surface-row{display:flex;align-items:center;gap:14px;margin-bottom:10px}.surface-tabs{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--inset)}.surface-tab{min-height:38px;border:0;border-right:1px solid var(--line);background:transparent;color:var(--ink2);padding:7px 17px;font-size:12px;font-weight:900;cursor:pointer}.surface-tab:last-child{border-right:0}.surface-tab[aria-selected="true"]{background:var(--ink);color:var(--card)}.surface-note{font-size:10.5px;line-height:1.45;color:var(--muted)}
body.graph-mode .shell{grid-template-columns:minmax(0,1fr)}body.graph-mode .filters{display:none}.graph-controls{display:grid;gap:10px}.graph-control-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.graph-control-label{font-size:10px;font-weight:900;color:var(--muted);letter-spacing:.06em}.graph-hub-tabs,.graph-view-tabs{display:flex;align-items:center;gap:6px;flex-wrap:wrap}.graph-chip{min-height:34px;border:1px solid var(--line);border-radius:100px;background:var(--card);color:var(--ink2);padding:6px 12px;font-size:11px;font-weight:800;cursor:pointer}.graph-chip[aria-selected="true"]{border-color:var(--teal);background:var(--tealbg);color:var(--teal)}.graph-filters{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding-top:9px;border-top:1px solid var(--line2)}.graph-filter{display:inline-flex;align-items:center;gap:6px;font-size:10.5px;color:var(--ink2);cursor:pointer}.graph-filter input{width:15px;height:15px;margin:0;accent-color:var(--teal)}

<body>
<header class="topbar">
  <a class="backlink" href="index.html">返回掃描儀表板</a>
  <h1 class="brand">研究中心</h1>
  <button class="themebtn" id="themeBtn" type="button" aria-label="切換深淺色">深／淺色</button>
</header>
<div class="shell">
  <aside class="filters" id="filters" aria-label="研究篩選條件">
    <div class="filter-head"><h2>篩選條件</h2><button class="clearbtn" id="clearFilters" type="button">清除全部</button><button class="filter-close" id="filterClose" type="button">關閉</button></div>
    <div id="groupFilters"></div>
    <div class="filter-group">
      <h3 class="filter-title">查核狀態</h3>
      <label class="filter-option"><input type="checkbox" name="status" value="verified" checked><span>已獨立核對來源</span></label>
      <label class="filter-option"><input type="checkbox" name="status" value="review" checked><span>草稿／部分核驗／衝突</span></label>
      <label class="filter-option"><input type="checkbox" name="status" value="observational" checked><span>觀察層研究</span></label>
    </div>
    <div class="filter-group">
      <h3 class="filter-title">更新時間</h3>
      <label class="filter-option"><input type="radio" name="date" value="all" checked><span>不限</span></label>
      <label class="filter-option"><input type="radio" name="date" value="today"><span>最新日</span></label>
      <label class="filter-option"><input type="radio" name="date" value="7"><span>近 7 天</span></label>
      <label class="filter-option"><input type="radio" name="date" value="30"><span>近 30 天</span></label>
    </div>
  </aside>
  <main class="content">
    <section class="tools" aria-label="搜尋與文章類型">
      <div class="surface-row">
        <div class="surface-tabs" role="tablist" aria-label="研究中心檢視">
          <button class="surface-tab" id="surfaceLibrary" type="button" role="tab" aria-selected="true">研究文章</button>
          <button class="surface-tab" id="surfaceRadar" type="button" role="tab" aria-selected="false">研究雷達</button>
          <button class="surface-tab" id="surfaceGraph" type="button" role="tab" aria-selected="false">知識圖譜</button>
        </div>
        <span class="surface-note">雷達安排研究資源，文章保留推理脈絡，圖譜投影關聯；都不是買賣建議。</span>
      </div>
      <div id="libraryControls">
        <div class="searchrow">
          <button class="filter-toggle" id="filterToggle" type="button" aria-controls="filters" aria-expanded="false">篩選</button>
          <input class="search" id="search" type="search" aria-label="搜尋研究文章" placeholder="搜尋公司、產業、主題、關鍵字或內文…" autocomplete="off">
        </div>
        <div class="toolrow">
          <div class="type-tabs" id="typeTabs" role="tablist" aria-label="文章類型"></div>
          <span class="result-total" id="resultTotal" aria-live="polite"></span>
          <select class="sort" id="sort" aria-label="文章排序"><option value="latest">最新更新</option><option value="oldest">最早更新</option><option value="subject">公司／主題</option></select>
        </div>
      </div>
      <div class="graph-controls" id="graphControls" hidden>
        <div class="graph-control-row">
          <span class="graph-control-label">主題中心</span>
          <div class="graph-hub-tabs" id="graphHubTabs" role="tablist" aria-label="知識圖譜主題"></div>
          <span class="graph-control-label">投影視角</span>
          <div class="graph-view-tabs" id="graphViewTabs" role="tablist" aria-label="知識圖譜視角"></div>
        </div>
        <div class="graph-filters">
          <span class="graph-control-label">證據層級</span>
          <label class="graph-filter"><input type="checkbox" name="graphEvidence" value="verified" checked>證實</label>
          <label class="graph-filter"><input type="checkbox" name="graphEvidence" value="inference" checked>推論</label>
          <label class="graph-filter"><input type="checkbox" name="graphEvidence" value="unverified" checked>待驗證</label>
          <label class="graph-filter"><input type="checkbox" id="graphUniverseOnly">只看台股 universe</label>
        </div>
      </div>
    </section>
    <div class="workarea" id="libraryPage">
      <section class="catalog" aria-label="研究文章清單">
        <div class="catalog-head"><h2>研究文章</h2><span id="catalogHint"></span></div>
        <div id="results"></div>
      </section>
      <section class="reader" aria-label="研究文章閱讀器">
        <div class="reader-scroll" id="readerScroll"><div id="reader"></div></div>
      </section>
    </div>
    <section class="graph-page" id="graphPage" aria-label="證據型知識圖譜" hidden>
      <div class="graph-shell">
        <header class="graph-intro">
          <div><h2 id="graphTitle">知識圖譜</h2><p id="graphSummary"></p></div>
          <div class="graph-stats" id="graphStats" aria-live="polite"></div>
        </header>
        <div class="graph-layout">
          <div class="graph-canvas-card">
            <div class="graph-legend" aria-label="圖譜圖例">
              <span class="legend-line"></span><span>證實</span>
              <span class="legend-line inference"></span><span>推論</span>
              <span class="legend-line unverified"></span><span>待驗證</span>
              <span class="legend-universe"></span><span>台股 universe</span>
              <span>同心環距離＋節點標籤＝商業曝險層級；線寬為輔助；淡化＝證據到期</span>
            </div>
            <div class="graph-canvas-scroll" tabindex="0" role="region" aria-label="可水平捲動的知識圖譜">
              <svg class="graph-svg" id="knowledgeGraph" viewBox="0 0 1100 700" role="img" aria-labelledby="graphSvgTitle graphSvgDesc"></svg>
            </div>
            <div class="graph-relations"><h3>可逐條查核的關係</h3><div class="graph-relation-list" id="graphRelationList"></div></div>
          </div>
          <aside class="graph-detail" id="graphDetail" aria-live="polite"></aside>
        </div>
      </div>
    </section>
    <section class="radar-page" id="radarPage" aria-label="候選研究主題雷達" hidden>
      <div class="radar-shell">
        <header class="radar-intro">
          <div>
            <h2>候選研究雷達</h2>
            <p>把「現在是否值得投入研究」與「研究後能增加多少產業理解」分開標記。排名用於配置研究時間，不代表預期報酬、股價方向或投資建議。</p>
          </div>
          <div class="radar-stats" id="radarStats" aria-live="polite"></div>
        </header>
        <div class="radar-method"><strong>排序方法</strong><p id="radarMethod"></p></div>
        <div class="radar-list" id="radarList"></div>
      </div>
    </section>
  </main>
</div>
<script>
const LIB=__RESEARCH_JSON__, MARKET_DATE="__DATE_ISO__", MARKET_DATE_LABEL="__DATE__";
const TYPE_INFO={
  all:{label:'全部'},formal_note:{label:'正式筆記'},narrative:{label:'多空小作文'},topic:{label:'市場議題'}

function cutoffDate(days){const anchor=new Date((LIB.anchor||MARKET_DATE)+'T00:00:00Z');anchor.setUTCDate(anchor.getUTCDate()-(days-1));return anchor.toISOString().slice(0,10)}
function filteredArticles(){let rows=LIB.articles.filter(article=>{

  if(state.search&&!article._search.includes(state.search))return false;
  return true;

function renderOutline(article){const aside=h('aside',{class:'outline'},h('div',{class:'outline-sticky'},h('h2',{text:'本頁大綱'})));const sticky=aside.firstChild;const toc=h('nav',{class:'toc','aria-label':'文章大綱'});(article.sections||[]).forEach((section,index)=>{const beginner=section.h==='新手先讀：這篇在講什麼';const button=h('button',{class:beginner?'beginner-toc':'',type:'button',text:section.h});button.addEventListener('click',()=>document.getElementById(sectionId(index))?.scrollIntoView({behavior:'smooth',block:'start'}));toc.appendChild(button)});sticky.append(toc,evidencePanel(article));return aside}
